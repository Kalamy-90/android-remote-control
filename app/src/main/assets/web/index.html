<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Android Remote Control</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #121212;
            color: #ffffff;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            height: 100vh;
        }
        #login-screen {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100%;
        }
        #control-screen {
            display: none;
            flex-direction: column;
            align-items: center;
            width: 100%;
            height: 100%;
        }
        input {
            padding: 10px;
            font-size: 18px;
            margin-bottom: 10px;
            border-radius: 5px;
            border: none;
        }
        button {
            padding: 10px 20px;
            font-size: 18px;
            background-color: #009688;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
        button:hover {
            background-color: #00796b;
        }
        #screen-container {
            position: relative;
            margin-top: 20px;
            border: 2px solid #333;
            max-height: 80vh;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #000;
        }
        #remote-screen {
            max-height: 80vh;
            display: block;
            max-width: 100%;
            object-fit: contain;
        }
        .nav-bar {
            display: flex;
            gap: 20px;
            margin-top: 20px;
            padding: 10px;
            background-color: #1e1e1e;
            border-radius: 10px;
        }
        .nav-btn {
            background-color: #333;
            width: 60px;
            height: 40px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-weight: bold;
        }
        #fullscreen-btn {
            position: absolute;
            top: 10px;
            right: 10px;
            background-color: rgba(0, 0, 0, 0.5);
            color: white;
            border: none;
            padding: 5px 10px;
            cursor: pointer;
            z-index: 10;
        }
        
        #quality-selector {
            margin-top: 10px;
            display: flex;
            gap: 10px;
            align-items: center;
        }
        
        select {
            padding: 5px;
            border-radius: 5px;
            background-color: #333;
            color: white;
            border: 1px solid #555;
        }
        
        /* Fullscreen specific styles */
        #screen-container:fullscreen {
            width: 100vw;
            height: 100vh;
            max-height: 100vh;
            margin: 0;
            border: none;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: black;
        }
        
        #screen-container:fullscreen #remote-screen {
            max-height: 100vh;
            max-width: 100vw;
            height: 100%;
            width: auto;
            object-fit: contain;
        }
    </style>
</head>
<body>

    <div id="login-screen">
        <h1>Connexion Sécurisée</h1>
        <input type="password" id="pin-input" placeholder="Entrez le PIN affiché sur le téléphone" maxlength="4">
        <button id="btn-connect" onclick="connect()">Connexion</button>
        <p id="status-msg" style="color: yellow; display: none;">Connexion en cours...</p>
        <p id="error-msg" style="color: red; display: none;">Erreur de connexion</p>
        <div id="debug-log" style="margin-top: 20px; font-size: 12px; color: #888; text-align: left; width: 80%; max-height: 100px; overflow-y: auto; border: 1px solid #333; padding: 5px;"></div>
    </div>

    <div id="control-screen">
        <div id="quality-selector">
            <label for="quality">Qualité:</label>
            <select id="quality" onchange="changeQuality()">
                <option value="low">Fluide (Basse Résolution)</option>
                <option value="medium" selected>Équilibré (Moyenne)</option>
                <option value="high">Haute Qualité (HD)</option>
            </select>
        </div>

        <div id="screen-container">
            <button id="fullscreen-btn" onclick="toggleFullscreen()">⛶</button>
            <img id="remote-screen" src="" alt="Écran distant">
        </div>

        <div class="nav-bar">
            <button class="nav-btn" onclick="sendKey('BACK')">◀</button>
            <button class="nav-btn" onclick="sendKey('HOME')">●</button>
            <button class="nav-btn" onclick="sendKey('RECENTS')">■</button>
        </div>
    </div>

    <script>
        let ws;
        const screenImg = document.getElementById('remote-screen');
        const screenContainer = document.getElementById('screen-container');

        function log(msg) {
            const logDiv = document.getElementById('debug-log');
            logDiv.innerHTML += `<div>${new Date().toLocaleTimeString()} - ${msg}</div>`;
            logDiv.scrollTop = logDiv.scrollHeight;
            console.log(msg);
        }

        function connect() {
            const pin = document.getElementById('pin-input').value;
            if (!pin) {
                alert("Veuillez entrer le PIN");
                return;
            }

            document.getElementById('btn-connect').disabled = true;
            document.getElementById('status-msg').style.display = 'block';
            document.getElementById('error-msg').style.display = 'none';
            log("Tentative de connexion...");

            const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
            const wsUrl = `${protocol}//${window.location.host}/control`;
            log(`Connecting to ${wsUrl}`);
            
            try {
                ws = new WebSocket(wsUrl);
            } catch (e) {
                log(`Erreur création WebSocket: ${e.message}`);
                resetUI();
                return;
            }

            ws.onopen = () => {
                log("WebSocket ouvert, envoi du PIN...");
                ws.send(JSON.stringify({ pin: pin }));
            };

            ws.onerror = (error) => {
                log("Erreur WebSocket (voir console)");
                console.error(error);
                document.getElementById('error-msg').innerText = "Erreur réseau WebSocket";
                document.getElementById('error-msg').style.display = 'block';
                resetUI();
            };

            ws.onmessage = (event) => {
                if (typeof event.data === 'string') {
                    log(`Message reçu: ${event.data}`);
                } else {
                    // Binary data = Image frame
                    const blob = event.data;
                    const url = URL.createObjectURL(blob);
                    screenImg.onload = () => URL.revokeObjectURL(url);
                    screenImg.src = url;
                    
                    if (document.getElementById('login-screen').style.display !== 'none') {
                        log("Premier frame reçu, affichage écran");
                        document.getElementById('login-screen').style.display = 'none';
                        document.getElementById('control-screen').style.display = 'flex';
                    }
                }
            };

            ws.onclose = (event) => {
                log(`WebSocket fermé: code=${event.code}, reason=${event.reason}`);
                if (event.code === 1008) { // Policy Violation (Wrong PIN)
                    document.getElementById('error-msg').innerText = "PIN Incorrect";
                    document.getElementById('error-msg').style.display = 'block';
                } else if (document.getElementById('control-screen').style.display === 'flex') {
                    alert("Connexion perdue");
                    location.reload();
                }
                resetUI();
            };
        }

        function resetUI() {
            document.getElementById('btn-connect').disabled = false;
            document.getElementById('status-msg').style.display = 'none';
        }

        function sendKey(code) {
            if (ws && ws.readyState === WebSocket.OPEN) {
                ws.send(JSON.stringify({ type: 'key', code: code }));
            }
        }

        function changeQuality() {
            const quality = document.getElementById('quality').value;
            let scale = 2; // Default to 1/2 (High Quality/Balanced thanks to WebP)
            let jpegQuality = 50;

            if (quality === 'low') {
                scale = 4; // 1/4 Resolution
                jpegQuality = 40;
            } else if (quality === 'medium') {
                scale = 2; // 1/2 Resolution (Boosted!)
                jpegQuality = 50;
            } else if (quality === 'high') {
                scale = 2; // 1/2 Resolution
                jpegQuality = 80; // High Quality Compression
            }

            if (ws && ws.readyState === WebSocket.OPEN) {
                ws.send(JSON.stringify({
                    type: 'quality',
                    scale: scale,
                    quality: jpegQuality
                }));
                log(`Changement qualité: ${quality} (1/${scale}, ${jpegQuality}%)`);
            }
        }

        function toggleFullscreen() {
            if (!document.fullscreenElement) {
                screenContainer.requestFullscreen().catch(err => {
                    alert(`Error attempting to enable full-screen mode: ${err.message} (${err.name})`);
                });
            } else {
                document.exitFullscreen();
            }
        }
        
        // Listen for fullscreen change events to reset styles properly
        document.addEventListener('fullscreenchange', (event) => {
            if (!document.fullscreenElement) {
                // Exiting fullscreen - reset styles
                screenImg.style.maxHeight = "80vh";
                screenImg.style.width = "auto";
                screenImg.style.height = "auto";
                screenContainer.style.width = "";
                screenContainer.style.height = "";
                screenContainer.style.margin = "20px 0 0 0";
                screenContainer.style.border = "2px solid #333";
            } else {
                // Entering fullscreen is handled by CSS :fullscreen pseudo-class
            }
        });

        // --- Touch & Mouse Event Handling ---

        let startX, startY;
        let isDragging = false;

        function handleStart(x, y) {
            startX = x;
            startY = y;
            isDragging = false;
        }

        function handleEnd(x, y) {
            if (startX === null || startY === null) return;

            const diffX = Math.abs(x - startX);
            const diffY = Math.abs(y - startY);
            const rect = screenImg.getBoundingClientRect();

            // Calculate relative coordinates based on the displayed image size
            // This works even if the image is centered with black bars
            
            // IMPORTANT: We must use the image's rect, not the container's
            // But we need to make sure the click was actually ON the image
            if (x < rect.left || x > rect.right || y < rect.top || y > rect.bottom) {
                // Clicked outside the image (on the black bars)
                startX = null;
                startY = null;
                return;
            }

            if (diffX > 10 || diffY > 10) {
                // Swipe
                const x1 = (startX - rect.left) / rect.width;
                const y1 = (startY - rect.top) / rect.height;
                const x2 = (x - rect.left) / rect.width;
                const y2 = (y - rect.top) / rect.height;

                if (ws && ws.readyState === WebSocket.OPEN) {
                    ws.send(JSON.stringify({
                        type: 'swipe',
                        x1: x1,
                        y1: y1,
                        x2: x2,
                        y2: y2,
                        duration: 300
                    }));
                }
            } else {
                // Tap
                const tapX = (x - rect.left) / rect.width;
                const tapY = (y - rect.top) / rect.height;

                if (ws && ws.readyState === WebSocket.OPEN) {
                    ws.send(JSON.stringify({
                        type: 'tap',
                        x: tapX,
                        y: tapY
                    }));
                }
            }

            startX = null;
            startY = null;
        }

        // Mouse Events
        screenImg.addEventListener('mousedown', (e) => {
            e.preventDefault();
            handleStart(e.clientX, e.clientY);
        });

        screenImg.addEventListener('mouseup', (e) => {
            e.preventDefault();
            handleEnd(e.clientX, e.clientY);
        });

        // Touch Events (for iPad/Mobile)
        screenImg.addEventListener('touchstart', (e) => {
            e.preventDefault(); // Prevent scrolling
            if (e.touches.length > 0) {
                handleStart(e.touches[0].clientX, e.touches[0].clientY);
            }
        }, { passive: false });

        screenImg.addEventListener('touchend', (e) => {
            e.preventDefault();
            if (e.changedTouches.length > 0) {
                handleEnd(e.changedTouches[0].clientX, e.changedTouches[0].clientY);
            }
        }, { passive: false });

    </script>
</body>
</html>
