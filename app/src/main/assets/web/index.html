<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Android Remote Control</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #121212;
            color: #ffffff;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            height: 100vh;
        }
        #login-screen {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100%;
        }
        #control-screen {
            display: none;
            flex-direction: column;
            align-items: center;
            width: 100%;
            height: 100%;
        }
        input {
            padding: 10px;
            font-size: 18px;
            margin-bottom: 10px;
            border-radius: 5px;
            border: none;
        }
        button {
            padding: 10px 20px;
            font-size: 18px;
            background-color: #009688;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
        button:hover {
            background-color: #00796b;
        }
        #screen-container {
            position: relative;
            margin-top: 20px;
            border: 2px solid #333;
            max-height: 80vh;
            overflow: hidden;
        }
        #remote-screen {
            max-height: 80vh;
            display: block;
        }
        .nav-bar {
            display: flex;
            gap: 20px;
            margin-top: 20px;
            padding: 10px;
            background-color: #1e1e1e;
            border-radius: 10px;
        }
        .nav-btn {
            background-color: #333;
            width: 60px;
            height: 40px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div id="login-screen">
        <h1>Connexion Sécurisée</h1>
        <input type="password" id="pin-input" placeholder="Entrez le PIN affiché sur le téléphone" maxlength="4">
        <button id="btn-connect" onclick="connect()">Connexion</button>
        <p id="status-msg" style="color: yellow; display: none;">Connexion en cours...</p>
        <p id="error-msg" style="color: red; display: none;">Erreur de connexion</p>
        <div id="debug-log" style="margin-top: 20px; font-size: 12px; color: #888; text-align: left; width: 80%; max-height: 100px; overflow-y: auto; border: 1px solid #333; padding: 5px;"></div>
    </div>

    <div id="control-screen">
        <div id="screen-container">
            <img id="remote-screen" src="" alt="Écran distant">
        </div>

        <div class="nav-bar">
            <button class="nav-btn" onclick="sendKey('BACK')">◀</button>
            <button class="nav-btn" onclick="sendKey('HOME')">●</button>
            <button class="nav-btn" onclick="sendKey('RECENTS')">■</button>
        </div>
    </div>

    <script>
        let ws;
        const screenImg = document.getElementById('remote-screen');
        const screenContainer = document.getElementById('screen-container');

        function log(msg) {
            const logDiv = document.getElementById('debug-log');
            logDiv.innerHTML += `<div>${new Date().toLocaleTimeString()} - ${msg}</div>`;
            logDiv.scrollTop = logDiv.scrollHeight;
            console.log(msg);
        }

        function connect() {
            const pin = document.getElementById('pin-input').value;
            if (!pin) {
                alert("Veuillez entrer le PIN");
                return;
            }

            document.getElementById('btn-connect').disabled = true;
            document.getElementById('status-msg').style.display = 'block';
            document.getElementById('error-msg').style.display = 'none';
            log("Tentative de connexion...");

            const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
            const wsUrl = `${protocol}//${window.location.host}/control`;
            log(`Connecting to ${wsUrl}`);
            
            try {
                ws = new WebSocket(wsUrl);
            } catch (e) {
                log(`Erreur création WebSocket: ${e.message}`);
                resetUI();
                return;
            }

            ws.onopen = () => {
                log("WebSocket ouvert, envoi du PIN...");
                ws.send(JSON.stringify({ pin: pin }));
            };

            ws.onerror = (error) => {
                log("Erreur WebSocket (voir console)");
                console.error(error);
                document.getElementById('error-msg').innerText = "Erreur réseau WebSocket";
                document.getElementById('error-msg').style.display = 'block';
                resetUI();
            };

            ws.onmessage = (event) => {
                if (typeof event.data === 'string') {
                    log(`Message reçu: ${event.data}`);
                } else {
                    // Binary data = Image frame
                    const blob = event.data;
                    const url = URL.createObjectURL(blob);
                    screenImg.onload = () => URL.revokeObjectURL(url);
                    screenImg.src = url;
                    
                    if (document.getElementById('login-screen').style.display !== 'none') {
                        log("Premier frame reçu, affichage écran");
                        document.getElementById('login-screen').style.display = 'none';
                        document.getElementById('control-screen').style.display = 'flex';
                    }
                }
            };

            ws.onclose = (event) => {
                log(`WebSocket fermé: code=${event.code}, reason=${event.reason}`);
                if (event.code === 1008) { // Policy Violation (Wrong PIN)
                    document.getElementById('error-msg').innerText = "PIN Incorrect";
                    document.getElementById('error-msg').style.display = 'block';
                } else if (document.getElementById('control-screen').style.display === 'flex') {
                    alert("Connexion perdue");
                    location.reload();
                }
                resetUI();
            };
        }

        function resetUI() {
            document.getElementById('btn-connect').disabled = false;
            document.getElementById('status-msg').style.display = 'none';
        }

        function sendKey(code) {
            if (ws && ws.readyState === WebSocket.OPEN) {
                ws.send(JSON.stringify({ type: 'key', code: code }));
            }
        }

        screenImg.addEventListener('click', (e) => {
            if (!ws || ws.readyState !== WebSocket.OPEN) return;
            
            const rect = screenImg.getBoundingClientRect();
            const scaleX = screenImg.naturalWidth / rect.width;
            const scaleY = screenImg.naturalHeight / rect.height;
            
            const x = (e.clientX - rect.left) * scaleX;
            const y = (e.clientY - rect.top) * scaleY;
            
            ws.send(JSON.stringify({
                type: 'tap',
                x: x,
                y: y
            }));
        });

        // Simple swipe detection
        let startX, startY;
        screenImg.addEventListener('mousedown', (e) => {
            startX = e.clientX;
            startY = e.clientY;
        });

        screenImg.addEventListener('mouseup', (e) => {
            if (!startX) return;
            const diffX = Math.abs(e.clientX - startX);
            const diffY = Math.abs(e.clientY - startY);
            
            if (diffX > 10 || diffY > 10) { // It's a swipe
                const rect = screenImg.getBoundingClientRect();
                const scaleX = screenImg.naturalWidth / rect.width;
                const scaleY = screenImg.naturalHeight / rect.height;
                
                ws.send(JSON.stringify({
                    type: 'swipe',
                    x1: (startX - rect.left) * scaleX,
                    y1: (startY - rect.top) * scaleY,
                    x2: (e.clientX - rect.left) * scaleX,
                    y2: (e.clientY - rect.top) * scaleY,
                    duration: 300
                }));
            }
            startX = null;
            startY = null;
        });
    </script>
</body>
</html>
