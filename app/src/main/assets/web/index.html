<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Android Remote Control</title>
    <!-- Add random query param to force reload -->
    <script>
        document.write('<script src="jmuxer.min.js?v=' + Math.random() + '"><\/script>');
    </script>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #121212;
            color: #ffffff;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            height: 100vh;
        }
        #login-screen {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100%;
        }
        #control-screen {
            display: none;
            flex-direction: column;
            align-items: center;
            width: 100%;
            height: 100%;
        }
        input {
            padding: 10px;
            font-size: 18px;
            margin-bottom: 10px;
            border-radius: 5px;
            border: none;
        }
        button {
            padding: 10px 20px;
            font-size: 18px;
            background-color: #009688;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
        button:hover {
            background-color: #00796b;
        }
        #screen-container {
            position: relative;
            margin-top: 10px;
            border: 2px solid #333;
            max-height: 80vh;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #000;
        }
        #remote-image, #remote-video {
            max-height: 80vh;
            display: block;
            max-width: 100%;
            object-fit: contain;
        }
        #remote-video {
            display: none; /* Hidden by default */
        }
        .nav-bar {
            display: flex;
            gap: 20px;
            margin-top: 10px;
            padding: 10px;
            background-color: #1e1e1e;
            border-radius: 10px;
        }
        .nav-btn {
            background-color: #333;
            width: 60px;
            height: 40px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-weight: bold;
        }
        #fullscreen-btn {
            position: absolute;
            top: 10px;
            right: 10px;
            background-color: rgba(0, 0, 0, 0.5);
            color: white;
            border: none;
            padding: 5px 10px;
            cursor: pointer;
            z-index: 10;
        }
        
        #settings-panel {
            margin-top: 10px;
            display: flex;
            gap: 15px;
            align-items: center;
            background-color: #1e1e1e;
            padding: 10px;
            border-radius: 8px;
        }
        
        .mode-switch {
            display: flex;
            background-color: #333;
            border-radius: 5px;
            overflow: hidden;
        }
        
        .mode-btn {
            padding: 5px 15px;
            background-color: transparent;
            border: none;
            color: #888;
            cursor: pointer;
            font-size: 14px;
        }
        
        .mode-btn.active {
            background-color: #009688;
            color: white;
        }
        
        select {
            padding: 5px;
            border-radius: 5px;
            background-color: #333;
            color: white;
            border: 1px solid #555;
        }
        
        /* Fullscreen specific styles */
        #screen-container:fullscreen {
            width: 100vw;
            height: 100vh;
            max-height: 100vh;
            margin: 0;
            border: none;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: black;
        }
        
        #screen-container:fullscreen #remote-image,
        #screen-container:fullscreen #remote-video {
            max-height: 100vh;
            max-width: 100vw;
            height: 100%;
            width: auto;
            object-fit: contain;
        }
    </style>
</head>
<body>

    <div id="login-screen">
        <h1>Connexion Sécurisée</h1>
        <input type="password" id="pin-input" placeholder="Entrez le PIN affiché sur le téléphone" maxlength="4">
        <button id="btn-connect" onclick="connect()">Connexion</button>
        <p id="status-msg" style="color: yellow; display: none;">Connexion en cours...</p>
        <p id="error-msg" style="color: red; display: none;">Erreur de connexion</p>
        <div id="debug-log" style="margin-top: 20px; font-size: 12px; color: #888; text-align: left; width: 80%; max-height: 100px; overflow-y: auto; border: 1px solid #333; padding: 5px;"></div>
    </div>

    <div id="control-screen">
        <div id="settings-panel">
            <div class="mode-switch">
                <button id="btn-mode-photo" class="mode-btn active" onclick="setMode('photo')">Photo</button>
                <button id="btn-mode-video" class="mode-btn" onclick="setMode('video')">Vidéo</button>
            </div>
            
            <div id="photo-settings">
                <select id="photo-quality" onchange="updatePhotoSettings()">
                    <option value="low">Fluide (1/4)</option>
                    <option value="medium" selected>Équilibré (1/2.5)</option>
                    <option value="high">Haute Qualité (1/1)</option>
                </select>
            </div>
            
            <div id="video-settings" style="display: none;">
                <select id="video-quality" onchange="updateVideoSettings()">
                    <option value="low">Fluide (480p / 1M)</option>
                    <option value="medium" selected>Équilibré (720p / 3M)</option>
                    <option value="high">HD (1080p / 6M)</option>
                </select>
                <select id="video-fps" onchange="updateVideoSettings()">
                    <option value="30" selected>30 FPS</option>
                    <option value="60">60 FPS</option>
                </select>
            </div>
        </div>

        <div id="screen-container">
            <span id="decoder-badge" style="position:absolute;top:10px;left:10px;background:rgba(0,150,100,0.7);color:white;padding:3px 8px;font-size:11px;border-radius:4px;z-index:10;pointer-events:none;display:none;"></span>
            <button id="fullscreen-btn" onclick="toggleFullscreen()">⛶</button>
            <img id="remote-image" src="" alt="Écran distant">
            <video id="remote-video" autoplay muted playsinline></video>
        </div>

        <div class="nav-bar">
            <button class="nav-btn" onclick="sendKey('BACK')">◀</button>
            <button class="nav-btn" onclick="sendKey('HOME')">●</button>
            <button class="nav-btn" onclick="sendKey('RECENTS')">■</button>
            <button class="nav-btn" onclick="sendKey('LOCK')" style="background-color: #d32f2f;">🔒</button>
        </div>
    </div>

    <script>
        let ws;
        let jmuxer;
        let currentMode = 'photo';
        let videoDecoder     = null;
        let remoteCanvas     = null;
        let canvasCtx        = null;
        let useVideoDecoder  = false;
        let nextVideoTimestamp = 0;
        
        const imgEl = document.getElementById('remote-image');
        const videoEl = document.getElementById('remote-video');
        const screenContainer = document.getElementById('screen-container');

        function supportsVideoDecoder() {
            return typeof VideoDecoder !== 'undefined' &&
                   typeof EncodedVideoChunk !== 'undefined';
        }

        function initVideoDecoder() {
            if (!supportsVideoDecoder()) { useVideoDecoder = false; return false; }
            if (!remoteCanvas) {
                remoteCanvas = document.createElement('canvas');
                remoteCanvas.id = 'remote-canvas';
                remoteCanvas.style.cssText = 'max-height:80vh;display:none;max-width:100%;object-fit:contain;cursor:crosshair;';
                document.getElementById('screen-container').insertBefore(remoteCanvas, document.getElementById('remote-video'));
                attachInputListeners(remoteCanvas);
            }
            if (videoDecoder && videoDecoder.state !== 'closed') {
                try { videoDecoder.close(); } catch(e) {}
            }
            nextVideoTimestamp = 0;
            videoDecoder = new VideoDecoder({
                output: (frame) => {
                    if (remoteCanvas.width !== frame.displayWidth || remoteCanvas.height !== frame.displayHeight) {
                        remoteCanvas.width = frame.displayWidth;
                        remoteCanvas.height = frame.displayHeight;
                        canvasCtx = remoteCanvas.getContext('2d');
                    }
                    canvasCtx.drawImage(frame, 0, 0);
                    frame.close();
                    if (ws && ws.readyState === WebSocket.OPEN) ws.send('ack_video');
                },
                error: (e) => {
                    if (videoDecoder && videoDecoder.state !== 'closed') {
                        try { videoDecoder.reset(); videoDecoder.configure({ codec: 'avc1.42E01E', optimizeForLatency: true }); } catch(_) {}
                    }
                }
            });
            try {
                videoDecoder.configure({ codec: 'avc1.42E01E', optimizeForLatency: true });
                useVideoDecoder = true;
                document.getElementById('decoder-badge').textContent = '⚡ VideoDecoder natif';
                document.getElementById('decoder-badge').style.display = 'block';
                return true;
            } catch(e) {
                useVideoDecoder = false;
                return false;
            }
        }

        function decodeVideoChunk(payload) {
            if (!useVideoDecoder || !videoDecoder) return;
            let isKeyframe = false;
            if (payload.length > 4) {
                const nalType = payload[4] & 0x1F;
                isKeyframe = (nalType === 5 || nalType === 7 || nalType === 8);
            }
            const timestamp = nextVideoTimestamp;
            nextVideoTimestamp += 33333;
            try {
                if (videoDecoder.decodeQueueSize > 5 && !isKeyframe) return;
                videoDecoder.decode(new EncodedVideoChunk({
                    type: isKeyframe ? 'key' : 'delta',
                    timestamp, duration: 33333, data: payload
                }));
            } catch(e) {
                if (videoDecoder.state !== 'closed') {
                    try { videoDecoder.reset(); videoDecoder.configure({ codec: 'avc1.42E01E', optimizeForLatency: true }); nextVideoTimestamp = 0; } catch(_) {}
                }
            }
        }

        function log(msg) {
            const logDiv = document.getElementById('debug-log');
            logDiv.innerHTML += `<div>${new Date().toLocaleTimeString()} - ${msg}</div>`;
            logDiv.scrollTop = logDiv.scrollHeight;
            console.log(msg);
        }

        function connect() {
            const pin = document.getElementById('pin-input').value;
            if (!pin) {
                alert("Veuillez entrer le PIN");
                return;
            }

            document.getElementById('btn-connect').disabled = true;
            document.getElementById('status-msg').style.display = 'block';
            document.getElementById('error-msg').style.display = 'none';
            log("Tentative de connexion...");

            // Initialize JMuxer with optimized buffer settings
            if (jmuxer) jmuxer.destroy();
            jmuxer = new JMuxer({
                node: 'remote-video',
                mode: 'video',
                flushingTime: 0, // Immediate flushing for low latency
                clearBuffer: true, // Clear buffer on new data to prevent lag accumulation
                fps: 30,
                debug: false
            });

            const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
            const wsUrl = `${protocol}//${window.location.host}/control`;
            
            try {
                ws = new WebSocket(wsUrl);
                ws.binaryType = 'arraybuffer';
            } catch (e) {
                log(`Erreur création WebSocket: ${e.message}`);
                resetUI();
                return;
            }

            ws.onopen = () => {
                log("WebSocket ouvert, envoi du PIN...");
                ws.send(JSON.stringify({ pin: pin }));
                // Send initial settings
                updatePhotoSettings();
            };

            ws.onerror = (error) => {
                console.error(error);
                document.getElementById('error-msg').innerText = "Erreur réseau WebSocket";
                document.getElementById('error-msg').style.display = 'block';
                resetUI();
            };

            ws.onmessage = (event) => {
                if (typeof event.data === 'string') {
                    log(`Message reçu: ${event.data}`);
                } else {
                    // Binary data
                    const data = new Uint8Array(event.data);
                    const type = data[0]; // 0x01 = Photo, 0x02 = Video
                    const payload = data.subarray(1);
                    
                    if (type === 0x01) { // Photo
                        if (currentMode !== 'photo') return;
                        const blob = new Blob([payload], { type: 'image/webp' });
                        const url = URL.createObjectURL(blob);
                        const oldUrl = imgEl.src;
                        imgEl.onload = () => {
                            URL.revokeObjectURL(oldUrl);
                            if (ws && ws.readyState === WebSocket.OPEN) ws.send('ack_photo'); // ACK après rendu réel
                        };
                        imgEl.src = url;
                        
                        if (document.getElementById('login-screen').style.display !== 'none') {
                            showControlScreen();
                        }
                    } else if (type === 0x02) { // Video
                        if (currentMode !== 'video') return;
                        if (useVideoDecoder) {
                            decodeVideoChunk(payload);
                        } else {
                            if (jmuxer) jmuxer.feed({ video: payload });
                            if (ws && ws.readyState === WebSocket.OPEN) ws.send('ack_video');
                        }
                        
                        if (document.getElementById('login-screen').style.display !== 'none') {
                            showControlScreen();
                        }
                    }
                }
            };

            ws.onclose = (event) => {
                log(`WebSocket fermé: code=${event.code}`);
                if (event.code === 1008) {
                    document.getElementById('error-msg').innerText = "PIN Incorrect";
                    document.getElementById('error-msg').style.display = 'block';
                } else if (document.getElementById('control-screen').style.display === 'flex') {
                    alert("Connexion perdue");
                    location.reload();
                }
                resetUI();
            };
        }
        
        function showControlScreen() {
            document.getElementById('login-screen').style.display = 'none';
            document.getElementById('control-screen').style.display = 'flex';
        }

        function resetUI() {
            document.getElementById('btn-connect').disabled = false;
            document.getElementById('status-msg').style.display = 'none';
        }

        function setMode(mode) {
            currentMode = mode;
            
            // Update UI buttons
            document.getElementById('btn-mode-photo').className = mode === 'photo' ? 'mode-btn active' : 'mode-btn';
            document.getElementById('btn-mode-video').className = mode === 'video' ? 'mode-btn active' : 'mode-btn';
            
            // Show/Hide settings
            document.getElementById('photo-settings').style.display = mode === 'photo' ? 'block' : 'none';
            document.getElementById('video-settings').style.display = mode === 'video' ? 'block' : 'none';
            
            // Show/Hide elements
            if (mode === 'video') {
                const ok = initVideoDecoder();
                if (ok && remoteCanvas) {
                    remoteCanvas.style.display = 'block';
                    videoEl.style.display = 'none';
                } else {
                    if (remoteCanvas) remoteCanvas.style.display = 'none';
                    videoEl.style.display = 'block';
                }
                imgEl.style.display = 'none';
            } else {
                if (remoteCanvas) remoteCanvas.style.display = 'none';
                videoEl.style.display = 'none';
                document.getElementById('decoder-badge').style.display = 'none';
                imgEl.style.display = 'block';
            }
            
            // Send command to server
            if (ws && ws.readyState === WebSocket.OPEN) {
                ws.send(JSON.stringify({ type: 'mode', value: mode }));
                
                // Apply current settings for the new mode
                if (mode === 'photo') updatePhotoSettings();
                else updateVideoSettings();
            }
        }

        function updatePhotoSettings() {
            const quality = document.getElementById('photo-quality').value;
            let scale = 2.5;
            let q = 50;

            if (quality === 'low') { scale = 4.0; q = 40; }
            else if (quality === 'medium') { scale = 2.5; q = 50; }
            else if (quality === 'high') { scale = 1.0; q = 70; }

            if (ws && ws.readyState === WebSocket.OPEN) {
                ws.send(JSON.stringify({
                    type: 'photo_settings',
                    scale: scale,
                    quality: q
                }));
            }
        }
        
        function updateVideoSettings() {
            const q = document.getElementById('video-quality').value;
            const fps = parseInt(document.getElementById('video-fps').value);
            
            let bitrate = 1000000;
            let scale = 0.4; // Default 480p approx

            if (q === 'low') { 
                bitrate = 1000000; // 1 Mbps
                scale = 0.4;       // ~480p
            } else if (q === 'medium') { 
                bitrate = 3000000; // 3 Mbps
                scale = 0.6;       // ~720p
            } else if (q === 'high') { 
                bitrate = 6000000; // 6 Mbps
                scale = 1.0;       // 1080p+
            }

            if (ws && ws.readyState === WebSocket.OPEN) {
                ws.send(JSON.stringify({
                    type: 'video_settings',
                    bitrate: bitrate,
                    fps: fps,
                    scale: scale
                }));
            }
        }

        function sendKey(code) {
            if (ws && ws.readyState === WebSocket.OPEN) {
                ws.send(JSON.stringify({ type: 'key', code: code }));
            }
        }
        
        function toggleFullscreen() {
            if (!document.fullscreenElement) {
                screenContainer.requestFullscreen().catch(err => console.error(err));
            } else {
                document.exitFullscreen();
            }
        }
        
        // Input Handling (Unified for both elements)
        function attachInputListeners(element) {
            let startX, startY;

            function handleStart(x, y) {
                startX = x;
                startY = y;
            }

            function handleEnd(x, y) {
                if (startX === null || startY === null) return;
                
                const rect = element.getBoundingClientRect();
                
                // Calculate actual image dimensions within the container (object-fit: contain)
                let displayedWidth, displayedHeight, offsetX, offsetY;
                
                const elementRatio = element.videoWidth ? (element.videoWidth / element.videoHeight) : (element.naturalWidth / element.naturalHeight);
                const containerRatio = rect.width / rect.height;
                
                if (!elementRatio) {
                    // Fallback if dimensions not yet available
                    displayedWidth = rect.width;
                    displayedHeight = rect.height;
                    offsetX = 0;
                    offsetY = 0;
                } else if (containerRatio > elementRatio) {
                    // Container is wider than image -> black bars on sides
                    displayedHeight = rect.height;
                    displayedWidth = displayedHeight * elementRatio;
                    offsetX = (rect.width - displayedWidth) / 2;
                    offsetY = 0;
                } else {
                    // Container is taller than image -> black bars on top/bottom
                    displayedWidth = rect.width;
                    displayedHeight = displayedWidth / elementRatio;
                    offsetX = 0;
                    offsetY = (rect.height - displayedHeight) / 2;
                }
                
                // Adjust coordinates relative to the actual image
                const relativeX = x - rect.left - offsetX;
                const relativeY = y - rect.top - offsetY;
                
                // Clamp coordinates to image bounds (fixes swipe from outside/edge)
                const clampedX = Math.max(0, Math.min(relativeX, displayedWidth));
                const clampedY = Math.max(0, Math.min(relativeY, displayedHeight));

                const diffX = Math.abs(x - startX);
                const diffY = Math.abs(y - startY);

                if (diffX > 10 || diffY > 10) {
                    // Swipe
                    // Calculate start coordinates relative to image too
                    const startRelX = startX - rect.left - offsetX;
                    const startRelY = startY - rect.top - offsetY;
                    
                    // Clamp start coordinates too
                    const clampedStartX = Math.max(0, Math.min(startRelX, displayedWidth));
                    const clampedStartY = Math.max(0, Math.min(startRelY, displayedHeight));
                    
                    const x1 = clampedStartX / displayedWidth;
                    const y1 = clampedStartY / displayedHeight;
                    const x2 = clampedX / displayedWidth;
                    const y2 = clampedY / displayedHeight;
                    
                    if (ws && ws.readyState === WebSocket.OPEN) {
                        ws.send(JSON.stringify({ type: 'swipe', x1, y1, x2, y2, duration: 300 }));
                    }
                } else {
                    // Tap - only if within bounds
                    if (relativeX >= 0 && relativeX <= displayedWidth && relativeY >= 0 && relativeY <= displayedHeight) {
                        const tapX = relativeX / displayedWidth;
                        const tapY = relativeY / displayedHeight;
                        
                        if (ws && ws.readyState === WebSocket.OPEN) {
                            ws.send(JSON.stringify({ type: 'tap', x: tapX, y: tapY }));
                        }
                    }
                }
                startX = null;
                startY = null;
            }

            element.addEventListener('mousedown', e => { e.preventDefault(); handleStart(e.clientX, e.clientY); });
            element.addEventListener('mouseup', e => { e.preventDefault(); handleEnd(e.clientX, e.clientY); });
            
            element.addEventListener('touchstart', e => {
                e.preventDefault();
                if (e.touches.length > 0) handleStart(e.touches[0].clientX, e.touches[0].clientY);
            }, { passive: false });
            
            element.addEventListener('touchend', e => {
                e.preventDefault();
                if (e.changedTouches.length > 0) handleEnd(e.changedTouches[0].clientX, e.changedTouches[0].clientY);
            }, { passive: false });
        }
        
        attachInputListeners(imgEl);
        attachInputListeners(videoEl);

    </script>
</body>
</html>
